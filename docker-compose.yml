version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.dev
    command: ["start"]
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - db
  db:
    image: postgres:12.2-alpine
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: development

volumes:
  node_modules:
  db-data:
