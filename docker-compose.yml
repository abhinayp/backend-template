version: "3.8"

services:
  server:
    container_name: PROJECTNAME-server
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        - GID=${GID:-1000}
        - UID=${UID:-1000}
        - USER=${USER:-PROJECTNAME}
    entrypoint: ["npm"]
    command: ["run", "start:dev"]
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      - PORT=5001
      - REDIS_HOST=redis://PROJECTNAME-redis:6379
    ports:
      - "5001:5001"
    depends_on:
      - redis
  redis:
    container_name: PROJECTNAME-redis
    image: redis:alpine
    ports:
      - "6379:6379"

